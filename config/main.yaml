name: MAIN.EXE
sha1: 6bcee82bde552b9c044330bcc8e1889e2b80b107
options:
  basename: main
  target_path: game/eu/MAIN.EXE
  base_path: ..
  platform: psx
  compiler: PSYQ
  asm_path: asm/main
  src_path: src/main
  build_path: build
  ld_script_path: build/main.ld
  symbol_addrs_path:
    - config/symbol_addrs_main.txt
  undefined_funcs_auto_path: build/undefined_funcs_auto.main.txt
  undefined_syms_auto_path: build/undefined_syms_auto.main.txt
  find_file_boundaries: False
  disassemble_all: True
  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  generate_asm_macros_files: True
  asm_inc_header: ".include \"macro.inc\"\n\n.set noat\n.set noreorder\n\n"
  section_order: [".rodata", ".text", ".data", ".bss"]
  subalign: 4
  string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
segments:
  - name: header
    type: header
    start: 0x0
  - name: main
    type: code
    start: 0x800
    vram: 0x80010000
    align: 4
    subalign: 4
    subsegments:
      - [0x800, rodata, main_rodata]
      - [0xD33C, asm, main]
      - [0x8DFCC, data, main_data]
  - [0xAF800]

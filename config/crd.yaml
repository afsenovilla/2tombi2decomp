name: CRD.BIN
sha1: 1cfb06cdda46ea7d48fc81790dc437543e62b032
options:
  basename: crd
  target_path: game/usa/BIN/CRD.BIN
  base_path: ..
  platform: psx
  compiler: PSYQ
  asm_path: asm/crd
  src_path: src/crd
  build_path: build
  ld_script_path: build/crd.ld
  symbol_addrs_path:
    - config/symbol_addrs_crd.txt
  undefined_funcs_auto_path: build/undefined_funcs_auto.crd.txt
  undefined_syms_auto_path: build/undefined_syms_auto.crd.txt
  find_file_boundaries: False
  disassemble_all: True
  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  generate_asm_macros_files: True
  asm_inc_header: ".include \"macro.inc\"\n\n.set noat\n.set noreorder\n\n"
  section_order: [".rodata", ".text", ".data", ".bss"]
  subalign: 4
  string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
segments:
  - name: crd
    type: code
    start: 0x0
    vram: 0x8018A000
    align: 4
    subalign: 4
    subsegments:
      - [0x0, rodata, crd_rodata]
      - [0x1E8, c, crd]
      - [0x5EC4, data, crd_data]
  - [0x61E4]

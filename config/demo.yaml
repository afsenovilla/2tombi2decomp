name: DEMO.BIN
sha1: e3988a70ed218b392a245301e4b20f34343cb7d1
options:
  basename: demo
  target_path: game/usa/BIN/DEMO.BIN
  base_path: ..
  platform: psx
  compiler: PSYQ
  asm_path: asm/demo
  src_path: src/demo
  build_path: build
  ld_script_path: build/demo.ld
  symbol_addrs_path:
    - config/symbol_addrs_demo.txt
  undefined_funcs_auto_path: build/undefined_funcs_auto.demo.txt
  undefined_syms_auto_path: build/undefined_syms_auto.demo.txt
  find_file_boundaries: False
  disassemble_all: True
  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  generate_asm_macros_files: True
  asm_inc_header: ".include \"macro.inc\"\n\n.set noat\n.set noreorder\n\n"
  section_order: [".rodata", ".text", ".data", ".bss"]
  subalign: 4
  string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
segments:
  - name: demo
    type: code
    start: 0x0
    vram: 0x80106228
    align: 4
    subalign: 4
    subsegments:
      - [0x0, rodata, demo_rodata]
      - [0xBC, c, demo]
      - [0x14DC, data, demo_data]
  - [0x14FC]
